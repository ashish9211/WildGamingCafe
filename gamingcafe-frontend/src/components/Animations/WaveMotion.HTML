<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Wave Motion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Apply Inter font and basic styling */
        body {
            font-family: "Inter", sans-serif;
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: #1a1a2e; /* Dark background for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        canvas {
            display: block;
            background-color: transparent; /* Canvas background is transparent to show body background */
            border-radius: 1rem; /* Rounded corners for the canvas */
        }

        /* Message box styling (for potential future use, replacing alert) */
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none; /* Hidden by default */
            text-align: center;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900">

    <canvas id="waveCanvas"></canvas>

    <div id="messageBox" class="message-box">
        <p id="messageText"></p>
        <button onclick="hideMessageBox()" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md">OK</button>
    </div>

    <script>
        // Get the canvas element and its 2D rendering context
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        // Array to store all active wave objects
        const waves = [];

        // Configuration for the waves
        const waveConfig = {
            startCorner: 'top-left', // Can be 'top-left', 'top-right', 'bottom-left', 'bottom-right'
            speed: 0.4,              // Reduced speed: How fast the wave expands and moves
            initialOpacity: 0.6,     // Starting opacity
            fadeRate: 0.0005,        // Significantly reduced fade rate for longer visibility
            spawnInterval: 1500,     // Time in ms between new wave spawns
            waveColor: '255, 255, 255', // RGB values for wave color (white)
            lineWidth: 2             // Thickness of the wave line
        };

        // Function to show a custom message box (replaces alert)
        function showMessageBox(message) {
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            messageText.textContent = message;
            messageBox.style.display = 'block';
        }

        // Function to hide the custom message box
        function hideMessageBox() {
            const messageBox = document.getElementById('messageBox');
            messageBox.style.display = 'none';
        }

        /**
         * Represents a single wave object.
         * @param {number} startX - The initial X coordinate of the wave's center.
         * @param {number} startY - The initial Y coordinate of the wave's center.
         * @param {string} targetCorner - The corner the wave is moving towards.
         * @param {number} canvasWidth - The current width of the canvas.
         * @param {number} canvasHeight - The current height of the canvas.
         */
        class Wave {
            constructor(startX, startY, targetCorner, canvasWidth, canvasHeight) {
                this.initialX = startX; // Store initial position for movement calculation
                this.initialY = startY;
                this.x = startX;
                this.y = startY;
                this.radius = 0;
                this.opacity = waveConfig.initialOpacity;
                this.targetCorner = targetCorner;

                // Determine movement direction based on target corner
                this.dx = 0;
                this.dy = 0;
                let targetX, targetY; // For calculating distance to target corner

                switch (this.targetCorner) {
                    case 'bottom-right':
                        this.dx = waveConfig.speed;
                        this.dy = waveConfig.speed;
                        targetX = canvasWidth;
                        targetY = canvasHeight;
                        break;
                    case 'bottom-left':
                        this.dx = -waveConfig.speed;
                        this.dy = waveConfig.speed;
                        targetX = 0;
                        targetY = canvasHeight;
                        break;
                    case 'top-right':
                        this.dx = waveConfig.speed;
                        this.dy = -waveConfig.speed;
                        targetX = canvasWidth;
                        targetY = 0;
                        break;
                    case 'top-left':
                        this.dx = -waveConfig.speed;
                        this.dy = -waveConfig.speed;
                        targetX = 0;
                        targetY = 0;
                        break;
                    default: // Default to bottom-right if invalid
                        this.dx = waveConfig.speed;
                        this.dy = waveConfig.speed;
                        targetX = canvasWidth;
                        targetY = canvasHeight;
                }
            }

            /**
             * Updates the wave's state for the next frame.
             */
            update() {
                this.radius += waveConfig.speed * 2; // Expand radius faster than movement
                this.opacity -= waveConfig.fadeRate; // Continuous fading
                this.x += this.dx;
                this.y += this.dy;

                // Ensure opacity doesn't go below 0
                this.opacity = Math.max(0, this.opacity);
            }

            /**
             * Draws the wave on the canvas.
             * @param {CanvasRenderingContext2D} context - The 2D rendering context of the canvas.
             */
            draw(context) {
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.strokeStyle = `rgba(${waveConfig.waveColor}, ${this.opacity})`;
                context.lineWidth = waveConfig.lineWidth;
                context.stroke();
            }

            /**
             * Checks if the wave is still active (visible).
             * The wave is active as long as its opacity is greater than 0.
             * It will naturally move off-screen and then be removed when fully transparent.
             * @returns {boolean} - True if the wave is active, false otherwise.
             */
            isActive() {
                return this.opacity > 0;
            }
        }

        /**
         * Resizes the canvas to fill the window and handles responsiveness.
         */
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // No need to clear existing waves or adjust them, they will continue their path.
        }

        /**
         * Spawns a new wave based on the configured starting corner.
         */
        function spawnWave() {
            let startX, startY, targetCorner;

            switch (waveConfig.startCorner) {
                case 'top-left':
                    startX = 0;
                    startY = 0;
                    targetCorner = 'bottom-right';
                    break;
                case 'top-right':
                    startX = canvas.width;
                    startY = 0;
                    targetCorner = 'bottom-left';
                    break;
                case 'bottom-left':
                    startX = 0;
                    startY = canvas.height;
                    targetCorner = 'top-right';
                    break;
                case 'bottom-right':
                    startX = canvas.width;
                    startY = canvas.height;
                    targetCorner = 'top-left';
                    break;
                default: // Default to top-left if invalid
                    startX = 0;
                    startY = 0;
                    targetCorner = 'bottom-right';
            }
            // Pass canvas dimensions to the Wave constructor for potential future calculations
            waves.push(new Wave(startX, startY, targetCorner, canvas.width, canvas.height));
        }

        // Variable to keep track of the last time a wave was spawned
        let lastWaveSpawnTime = 0;

        /**
         * The main animation loop.
         */
        function animate() {
            requestAnimationFrame(animate); // Request the next animation frame

            // Clear the entire canvas for the new frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const currentTime = performance.now();

            // Spawn a new wave if enough time has passed
            if (currentTime - lastWaveSpawnTime > waveConfig.spawnInterval) {
                spawnWave();
                lastWaveSpawnTime = currentTime;
            }

            // Update and draw each wave
            for (let i = 0; i < waves.length; i++) {
                const wave = waves[i];
                wave.update();
                wave.draw(ctx);

                // Remove inactive waves (fully transparent) to prevent performance issues
                if (!wave.isActive()) {
                    waves.splice(i, 1);
                    i--; // Decrement i because we removed an element
                }
            }
        }

        // Event listeners
        window.addEventListener('resize', resizeCanvas); // Resize canvas when window resizes

        // Start the animation when the window loads
        window.onload = function () {
            resizeCanvas(); // Initial canvas resize
            animate();      // Start the animation loop
        };
    </script>
</body>
</html>
